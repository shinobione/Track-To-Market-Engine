name: Deploy Track-To-Market AI Worker

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to publish the dedicated Track-To-Market AI Worker'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Worker
        run: npx wrangler@4.115.0 deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test Worker health
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error https://track-to-market-ai.jerryquinet.workers.dev/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo 'Track-To-Market AI Worker health check failed after deployment.' >&2
          exit 1
